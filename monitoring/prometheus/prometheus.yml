# Prometheus configuration for the sensor ingestion stack.
# Mounted read-only into the prometheus container at /etc/prometheus/prometheus.yml.

global:
  # 5 s (Prometheus's default is 1 m) so experiments show changes within seconds,
  # and rate(...[1m]) always has ~12 samples to work with.
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  # The FastAPI app: HTTP, ingestion, device-status and process metrics.
  - job_name: sensor-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # The gRPC server (A2 Part B): gRPC call metrics plus its own ingestion and
  # process metrics, served by prometheus_client on a separate HTTP port.
  - job_name: sensor-grpc
    metrics_path: /metrics
    static_configs:
      - targets: ["grpc:9101"]

  # Node Exporter runs on the host network (see docker-compose.yml), so it is
  # reached through the Docker host gateway rather than by service name.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # Experiment E2 only (scripts/cardinality_demo.sh). Targets come from
  # file_sd/cardinality-demo.json, which holds [] except while the demo runs,
  # so normally this job has no targets and nothing shows as down.
  - job_name: cardinality-demo
    file_sd_configs:
      - files: ["/etc/prometheus/file_sd/*.json"]
        refresh_interval: 5s

  # Prometheus's own metrics (scrape health, TSDB size, series count).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
